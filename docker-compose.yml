services:
  web:
    build: .
    image: lead-compare:latest
    container_name: lead-compare
    ports:
      - "8000:8000"
    volumes:
      - lead_data:/data
    environment:
      APP_DB_PATH: /data/app.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  lead_data:
